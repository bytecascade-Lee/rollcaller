version: 2

# open-pull-requests-limit: 0 ⇒ 关闭版本更新、只保留安全更新（安全更新 PR 不受该 limit 约束）
#
# 默认分支为 develop ⇒ 版本更新与安全更新都直接打在 develop 上，**无需 target-branch**。
# 反之一旦写上 target-branch（哪怕指向同一个分支），该条目的其它选项（labels / reviewers /
# commit-message…）对安全更新会一并失效 —— 要给安全更新 PR 打标签时尤其要注意。
updates:
    -   package-ecosystem: "npm"
        directory: "/frontend"
        schedule:
            interval: "weekly"
        open-pull-requests-limit: 0

    -   package-ecosystem: "cargo"
        directory: "/backend"
        schedule:
            interval: "weekly"
        open-pull-requests-limit: 0
