name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: '待发布的语义化版本号，形如 0.1.0-rc.1，携带的构建元数据会被静默擦除'
                required: true
                type: string
            draft:
                description: '是否发布为草稿'
                required: false
                type: boolean
                default: false

permissions:
    contents: read

env:
    PYTHONIOENCODING: utf-8
    PYTHONPATH: ${{ github.workspace }}/scripts
    NO_COLOR: 1

jobs:
    prepare:
        name: Prepare
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.prepare.outputs.version }}
            draft: ${{ steps.prepare.outputs.draft }}
            matrix: ${{ steps.prepare.outputs.matrix }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup uv
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true

            -   name: Install Python dependencies
                run: |
                    uv lock --check
                    uv sync --frozen

            -   name: Validate version and notes, and generate matrix
                id: prepare
                run: uv run --frozen ./scripts/prepare.py -v "${{ inputs.version || github.ref_name }}" ${{ inputs.draft && '--draft' || '' }}

    build:
        name: Build & upload assets with ${{ matrix.target }}
        needs: prepare
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup uv
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true

            -   name: Setup pnpm
                uses: pnpm/action-setup@v6
                with:
                    version: 11.22.0

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 26
                    cache: pnpm
                    cache-dependency-path: frontend/pnpm-lock.yaml

            -   name: Install Python dependencies
                run: |
                    uv lock --check
                    uv sync --frozen

            -   name: Install frontend dependencies
                working-directory: frontend
                run: pnpm install --frozen-lockfile

            #-   name: Install Linux dependencies
            #    if: matrix.os == 'linux'
            #    run: |
            #        sudo apt-get update
            #        sudo apt-get install -y \
            #            libwebkit2gtk-4.1-dev \
            #            build-essential \
            #            curl \
            #            wget \
            #            file \
            #            libxdo-dev \
            #            libssl-dev \
            #            libayatana-appindicator3-dev \
            #            librsvg2-dev \
            #            patchelf \
            #            pkg-config \
            #            libfuse2

            -   name: Install Rust toolchain (cargo/rustc)
                uses: dtolnay/rust-toolchain@stable
                with:
                    targets: ${{ matrix.target }}

            -   name: Cache cargo
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: backend
                    # 所有架构共享 registry 缓存
                    shared-key: cargo-registry
                    # 架构特定的 target 目录缓存
                    key: ${{ matrix.target }}

            -   name: Configure arm64 msvc development environment
                if: matrix.os == 'windows' && matrix.arch == 'arm64'
                uses: step-security/msvc-dev-cmd@v1
                with:
                    arch: amd64_arm64

            -   name: Fetch Rust dependencies
                working-directory: backend
                run: cargo fetch --locked

            -   name: Build and package
                env:
                    MIMO_TTS_API_KEY: ${{ secrets.MIMO_TTS_API_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                run: uv run --frozen ./scripts/build.py -v "${{ needs.prepare.outputs.version }}" -t ${{ matrix.target }} -m ci

            -   name: Upload artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: release-assets-${{ matrix.target }}
                    path: |
                        assets/rollcaller-*
                    if-no-files-found: error

    release:
        name: Publish GitHub & CNB releases
        needs: build
        runs-on: ubuntu-latest
        concurrency:
            group: release
            cancel-in-progress: false
        permissions:
            contents: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup uv
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true

            -   name: Set up Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 26

            -   name: Install Python dependencies
                run: uv sync --frozen

            -   name: Install CNB CLI
                run: npm install -g @cnbcool/cnb-cli@1.10.17

            -   name: Download artifacts
                uses: actions/download-artifact@v8
                with:
                    path: assets
                    pattern: release-assets-*
                    merge-multiple: true

            -   name: Publish GitHub & CNB releases
                env:
                    GH_TOKEN: ${{ github.token }}
                    CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
                run: uv run --frozen ./scripts/release.py -v "${{ needs.prepare.outputs.version }}" -m ci ${{ needs.prepare.outputs.draft == 'true' && '--draft' || '' }}
