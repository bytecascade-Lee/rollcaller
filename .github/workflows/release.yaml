name: Release

on:
    push:
        # 只匹配 v 开头的 tag（v0.1.0、v0.1.0-rc.1 等）
        # 含 alpha/beta 的在 release_ci.py 内校验并报错
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: '发布版本号（不带 v），例如 0.1.0 或 0.1.0-rc.1'
                required: true
                type: string
            draft:
                description: '发布草稿'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    validate:
        name: Validate version
        runs-on: windows-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Check version (fail fast on alpha/beta)
                run: uv run python -c "import sys; sys.path.insert(0, 'scripts'); from release_ci import ci_version; ci_version()"

    build:
        name: Build & upload assets (${{ matrix.target }})
        needs: validate
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                target:
                    - x86_64-pc-windows-msvc
                    - aarch64-pc-windows-msvc
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Setup pnpm
                uses: pnpm/action-setup@v6
                with:
                    version: 11

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: pnpm
                    cache-dependency-path: frontend/pnpm-lock.yaml

            -   name: Install frontend dependencies
                working-directory: frontend
                run: |
                    Write-Host "pnpm version: $(pnpm --version)"
                    pnpm install --frozen-lockfile

            -   name: Install Rust toolchain (cargo/rustc)
                uses: dtolnay/rust-toolchain@stable
                with:
                    targets: ${{ matrix.target }}

            -   name: Cache cargo
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: backend
                    # 各架构缓存 key 隔离，避免两个矩阵 Job 互相覆盖缓存
                    key: ${{ matrix.target }}

            -   name: Cache tauri-cli
                id: tauri-cli
                uses: actions/cache@v6
                with:
                    path: cargo-tauri.exe
                    key: tauri-cli-2.11.4

                # 只在 ARM64 任务中配置 MSVC ARM64 环境
            -   name: Configure arm64 msvc development environment
                if: matrix.target == 'aarch64-pc-windows-msvc'
                uses: step-security/msvc-dev-cmd@v1
                with:
                    arch: amd64_arm64

            -   name: Install tauri-cli (prebuilt, no Tauri actions)
                if: steps.tauri-cli.outputs.cache-hit != 'true'
                shell: pwsh
                run: |
                    Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-pc-windows-msvc.zip" -OutFile cargo-tauri.zip
                    Expand-Archive -Path cargo-tauri.zip -DestinationPath . -Force

                # 版本号/arch/产物命名全部由 release_ci.py 从 GitHub 环境变量推导，workflow 不再重复实现
            -   name: Build & package
                run: uv run python scripts/release_ci.py build --target ${{ matrix.target }}

            -   name: Upload artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: release-assets-${{ matrix.target }}
                    path: |
                        rollcaller-*-windows-*-setup.exe
                        rollcaller-*-windows-*-portable.zip
                    if-no-files-found: error

    release:
        name: Publish GitHub release
        needs: build
        runs-on: windows-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Download build artifacts
                uses: actions/download-artifact@v7
                with:
                    path: assets
                    pattern: release-assets-*
                    merge-multiple: true

            -   name: Publish GitHub release
                env:
                    GH_TOKEN: ${{ github.token }}
                    DRAFT_RELEASE: ${{ inputs.draft }}
                run: uv run python scripts/release_ci.py publish
