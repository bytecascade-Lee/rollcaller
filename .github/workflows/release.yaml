name: Release

on:
    push:
        # 只匹配 v 开头的 tag（v0.1.0、v0.1.0-rc.1 等）
        # 含 alpha/beta 的在 Job 内校验并报错
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: '发布版本号（不带 v），例如 0.1.0 或 0.1.0-rc.1'
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Build & publish Windows x86_64
        runs-on: windows-latest
        steps:
            -   name: Determine version
                id: version
                shell: pwsh
                env:
                    VERSION_INPUT: ${{ inputs.version }}
                run: |
                    if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
                      $version = $env:VERSION_INPUT.TrimStart('v')
                    } else {
                      $version = $env:GITHUB_REF_NAME.TrimStart('v')
                    }
                    if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
                      throw "Invalid version '$version' - must look like 0.1.0 or 0.1.0-rc.1"
                    }
                    if ($version -match '(?i)alpha|beta') {
                      throw "Version '$version' must not contain alpha or beta"
                    }
                    "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
                    "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup pnpm
                uses: pnpm/action-setup@v6
                with:
                    version: 11

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: pnpm
                    cache-dependency-path: frontend/pnpm-lock.yaml

            -   name: Install frontend dependencies
                working-directory: frontend
                run: |
                    Write-Host "pnpm version: $(pnpm --version)"
                    pnpm install --frozen-lockfile

            -   name: Install Rust toolchain (cargo/rustc)
                uses: dtolnay/rust-toolchain@stable

            -   name: Cache cargo
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: backend

            -   name: Install tauri-cli (prebuilt, no Tauri actions)
                shell: pwsh
                run: |
                    Invoke-WebRequest -Uri "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-pc-windows-msvc.zip" -OutFile cargo-tauri.zip
                    Expand-Archive -Path cargo-tauri.zip -DestinationPath . -Force
                    Get-ChildItem -Path . -Filter 'cargo-tauri*.exe'

            -   name: Build (cargo tauri build)
                shell: pwsh
                working-directory: backend
                run: |
                    # 清掉可能从缓存带入的旧 bundle，保证 nsis 目录里只有一个安装包
                    Remove-Item -Recurse -Force .\target\release\bundle -ErrorAction SilentlyContinue
                    & "${{ github.workspace }}\cargo-tauri-x86_64-pc-windows-msvc.exe" build

            -   name: Package installer (setup.exe)
                shell: pwsh
                run: |
                    $version = "${{ steps.version.outputs.version }}"
                    $setup = @(Get-ChildItem -Path "backend/target/release/bundle/nsis" -Filter *.exe)
                    if ($setup.Count -ne 1) {
                      throw "Expected exactly one NSIS installer in bundle/nsis, found $($setup.Count)"
                    }
                    $setupName = "rollcaller-$version-windows-x86_64-setup.exe"
                    Copy-Item $setup[0].FullName -Destination $setupName
                    Write-Host "Setup installer: $setupName"

            -   name: Package portable zip
                shell: pwsh
                run: |
                    $version = "${{ steps.version.outputs.version }}"
                    $releaseDir = "backend/target/release"
                    foreach ($item in @("rollcaller.exe", "config", "database")) {
                      if (-not (Test-Path (Join-Path $releaseDir $item))) {
                        throw "Missing '$item' in $releaseDir"
                      }
                    }
                    # 空白文件 portable.mode：不在 release 目录中，必须由这里创建后一并打入
                    $portableMode = Join-Path $releaseDir "portable.mode"
                    [System.IO.File]::WriteAllBytes($portableMode, [byte[]]@())
                    $portableName = "rollcaller-$version-windows-x86_64-portable.zip"
                    Compress-Archive -Path @(
                      (Join-Path $releaseDir "rollcaller.exe"),
                      (Join-Path $releaseDir "config"),
                      (Join-Path $releaseDir "database"),
                      $portableMode
                    ) -DestinationPath $portableName -CompressionLevel Optimal
                    Write-Host "Portable package: $portableName"

            -   name: Extract release notes
                shell: pwsh
                run: |
                    $version = "${{ steps.version.outputs.version }}"
                    $escaped = [regex]::Escape($version)
                    $lines = Get-Content -Path RELEASE_NOTES.md
                    $inSection = $false
                    $body = New-Object System.Collections.Generic.List[string]
                    foreach ($line in $lines) {
                      if ($line -match "^## $escaped\s*$") { $inSection = $true; continue }
                      if ($inSection -and $line -match '^##\s') { break }
                      if ($inSection) { [void]$body.Add($line) }
                    }
                    if ($body.Count -eq 0) {
                      throw "Section '## $version' not found in RELEASE_NOTES.md"
                    }
                    (($body -join "`n") + "`n") | Set-Content -Path release_notes.md -Encoding utf8

            -   name: Publish GitHub release
                shell: pwsh
                env:
                    GH_TOKEN: ${{ github.token }}
                    VERSION: ${{ steps.version.outputs.version }}
                    TAG: ${{ steps.version.outputs.tag }}
                run: |
                    $args = @(
                      "release", "create", $env:TAG,
                      "--repo", $env:GITHUB_REPOSITORY,
                      "--title", $env:VERSION,
                      "--notes-file", "release_notes.md"
                    )
                    # 手动触发时 tag 可能尚不存在，指向本次提交
                    if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
                      $args += @("--target", $env:GITHUB_SHA)
                    }
                    $args += @(
                      "rollcaller-$($env:VERSION)-windows-x86_64-setup.exe",
                      "rollcaller-$($env:VERSION)-windows-x86_64-portable.zip"
                    )
                    & gh @args
