name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: '待发布的语义化版本号，形如 0.1.0-rc.1，携带的构建元数据会被静默擦除'
                required: true
                type: string
            draft:
                description: '是否发布为草稿'
                required: false
                type: boolean
                default: false

permissions:
    contents: write

env:
    PYTHONIOENCODING: utf-8
    PYTHONPATH: ${{ github.workspace }}/scripts
    NO_COLOR: 1

jobs:
    prepare:
        name: Prepare
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.prepare.outputs.version }}
            draft: ${{ steps.prepare.outputs.draft }}
            matrix: ${{ steps.prepare.outputs.matrix }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Check version & notes, generate matrix
                id: prepare
                run: uv run ./scripts/prepare.py -v "${{ inputs.version || github.ref_name }}" ${{ inputs.draft && '--draft' || '' }}

    build:
        name: Build & upload assets with ${{ matrix.target }}
        needs: prepare
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Setup pnpm
                uses: pnpm/action-setup@v6
                with:
                    version: 11

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: pnpm
                    cache-dependency-path: frontend/pnpm-lock.yaml

            -   name: Install frontend dependencies
                working-directory: frontend
                run: pnpm install --frozen-lockfile

            -   name: Install Rust toolchain (cargo/rustc)
                uses: dtolnay/rust-toolchain@stable
                with:
                    targets: ${{ matrix.target }}

            -   name: Cache cargo
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: backend
                    # 所有架构共享 registry 缓存
                    shared-key: cargo-registry
                    # 架构特定的 target 目录缓存
                    key: ${{ matrix.target }}

            # 只在 ARM64 任务中配置 MSVC ARM64 环境
            # [TODO]：跨平台的 arm64 配置
            -   name: Configure arm64 msvc development environment
                if: matrix.arch == 'arm64'
                uses: step-security/msvc-dev-cmd@v1
                with:
                    arch: amd64_arm64

            -   name: Build & package
                env:
                    MIMO_TTS_API_KEY: ${{ secrets.MIMO_TTS_API_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                    TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                run: uv run ./scripts/build.py -v "${{ needs.prepare.outputs.version }}" -t ${{ matrix.target }} -m ci

            -   name: Upload artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: release-assets-${{ matrix.target }}
                    path: |
                        assets/rollcaller-*
                    if-no-files-found: error

    release:
        name: Publish GitHub & CNB releases
        needs: build
        runs-on: windows-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup uv
                uses: astral-sh/setup-uv@v5

            -   name: Install cnb cli
                shell: pwsh
                run: npm install -g @cnbcool/cnb-cli

            -   name: Download build artifacts
                uses: actions/download-artifact@v7
                with:
                    path: assets
                    pattern: release-assets-*
                    merge-multiple: true

            -   name: Publish GitHub & CNB releases
                env:
                    GH_TOKEN: ${{ github.token }}
                    CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
                run: uv run ./scripts/release.py -v "${{ needs.prepare.outputs.version }}" -m ci ${{ needs.prepare.outputs.draft == 'true' && '--draft' || '' }}
