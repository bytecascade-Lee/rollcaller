name: Dependabot PR Signal

# 只负责发出一句"Dependabot 开了 PR 到 master"的信号，不做任何需要权限的事。
#
# 为什么拆成两个文件：Dependabot 触发的运行会被降权（只读 GITHUB_TOKEN、拿不到 Actions secrets），
# 且 pull_request_target 对这种 PR 更是完全取不到 secrets —— 在带 PR 上下文的事件里无法改基线。
# 真正动手的步骤放在 workflow_run 唤起的 dependabot-security-pr-retarget.yaml
on:
    pull_request:
        types: [ opened, reopened, synchronize ]
        branches: [ master ]

permissions: { }

jobs:
    signal:
        name: Signal
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            -   name: Emit signal
                env:
                    PR_NUMBER: ${{ github.event.pull_request.number }}
                run: echo "dependabot PR #$PR_NUMBER targets master"
