name: Quality Gate

on:
    push:
        branches:
            - develop
            - master
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'LICENSE'
    pull_request:
        branches:
            - develop
            - master
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'LICENSE'
    workflow_dispatch:

permissions:
    contents: read

env:
    PYTHONIOENCODING: utf-8
    PYTHONPATH: ${{ github.workspace }}/scripts
    FORCE_COLOR: 1
    # [TODO]：只有 x64 能在 runner 上原生执行，arm64 交叉编译出来的测试二进制无法运行；
    # 所以这里先不上矩阵、目标写死；将来有了 arm64 runner 再改成按 support.entries(Action.TEST) 生成。
    TRIPLE: x86_64-pc-windows-msvc

# 同一分支不断 push 只留最后一次
concurrency:
    group: quality-gate-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Check and test
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            -   name: Check out repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Set up uv
                uses: astral-sh/setup-uv@v10.3.0
                with:
                    enable-cache: true

            -   name: Set up pnpm
                uses: pnpm/action-setup@v6
                with:
                    version: 12.15.0

            -   name: Set up Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 26
                    cache: pnpm
                    cache-dependency-path: frontend/pnpm-lock.yaml

            -   name: Install Python dependencies
                run: |
                    uv lock --check
                    uv sync --frozen

            -   name: Install frontend dependencies
                working-directory: frontend
                run: pnpm install --frozen-lockfile

            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
                with:
                    targets: ${{ env.TRIPLE }}

            -   name: Cache Rust build
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: backend
                    shared-key: cargo-test
                    key: ${{ env.TRIPLE }}

            -   name: Materialize cargo config
                run: cp backend/.cargo/config.toml.example backend/.cargo/config.toml

            -   name: Fetch Rust dependencies
                working-directory: backend
                run: cargo fetch --locked

            -   name: Type check frontend
                working-directory: frontend
                run: pnpm check

            -   name: Run tests
                env:
                    MIMO_TTS_API_KEY: ${{ secrets.MIMO_TTS_API_KEY }}
                run: uv run --frozen ./scripts/test.py -t ${{ env.TRIPLE }}

            -   name: Check generated files are committed
                run: git diff --exit-code -- frontend/src/lib/types frontend/src/lib/routing/entries.generated.ts
