name: Sync Mirrors

on:
    push:
        branches:
            - '**'
            - '!dependabot/**'
        tags:
            - '**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    sync:
        name: Sync to CNB
        runs-on: ubuntu-latest
        steps:
            -   name: Check out repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Push branches and tags to CNB
                shell: bash
                env:
                    CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
                run: |
                    git push \
                      "https://cnb:${CNB_TOKEN}@cnb.cool/ordinary-glory/rollcaller.git" \
                      "+refs/heads/*:refs/heads/*" \
                      "+refs/tags/*:refs/tags/*"
