[package]
name = "rollcaller"
version = "0.1.0"
description = "A feature rich automatic roll-call software"
authors = ["Serene Lee"]
edition = "2021"

[lib]
name = "rollcaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
calamine = "0.36"
directories = "6.0"
hex = "0.4"
jiff = "0.2"
parking_lot = "0.12"
rbatis = {version = "4.8", features = ["debug_mode"] }
rbs = "4.8"
rbdc-sqlite = { version = "4.9", features = ["sqlite-bundled"] }
rust_xlsxwriter = "0.96"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
tauri = { version = "2.11", features = ["config-json5"] }
tauri-plugin-opener = "2.5"
tauri-plugin-tracing = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-core = "0.1.36"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
ts-rs = "12.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"
